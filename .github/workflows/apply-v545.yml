name: Apply v545 container and cooler updates

on:
  push:
    paths:
      - .github/workflows/apply-v545.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact v545 changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "ea6acf8594494add003723f8419a042a37611b8a"
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='const GEAR_CATALOG = '
          s=t.index(marker)+len(marker)
          e=t.index(';\n',s)
          cat=json.loads(t[s:e])
          byid={x['id']:x for x in cat}
          byname={x['name']:x for x in cat}
          trash=byid['gc0767']
          assert trash['name']=='Trash Bag, 13 Gallon'
          for alias in ['Kitchen Trash Bag','13 Gallon Kitchen Trash Bag']:
              if alias.lower() not in [a.lower() for a in trash.get('aliases',[])]:
                  trash.setdefault('aliases',[]).append(alias)
          cheap=[
          {'id':'gc2361','name':'Plastic Grocery Bag, Disposable','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':0.012,'price':0.02,'availability':'Ubiquitous','colors':['White','Clear','Black','Blue','Green','Red'],'specs':'Standard 1/6-size disposable HDPE grocery / T-shirt bag, about 11.5 × 21–22 in with side gussets and dual handles · Typical standard-duty thickness about 0.5 mil · Representative empty weight about 0.012 lb (0.2 oz) · Practical load about 10 lb','createsLocation':True,'aliases':['plastic shopping bag','grocery sack','t-shirt bag','checkout bag','disposable shopping bag'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':10,'wetRetention':'very_low','dirtRetention':'low'},
          {'id':'gc2362','name':'Paper Grocery Bag','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':0.05,'price':0.04,'availability':'Ubiquitous','colors':['Brown','White'],'specs':'Standard kraft paper grocery sack, approximately 7.75 × 4.8 × 16 in · 40 lb basis-weight paper · Representative 16 lb nominal grocery-bag size · Empty weight about 0.05 lb (0.8 oz)','createsLocation':True,'aliases':['brown paper grocery bag','paper shopping bag','grocery paper bag','grocery sack','paper grocery sack'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':15,'wetRetention':'very_high','dirtRetention':'low'},
          {'id':'gc2363','name':'Paper Lunch Bag','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':0.015,'price':0.03,'availability':'Ubiquitous','colors':['Brown','White'],'specs':'Small kraft paper lunch sack, approximately 5 × 3.1 × 9.75 in · Standard-duty 30 lb basis-weight paper · Representative 4 lb nominal size · Empty weight about 0.015 lb (0.24 oz)','createsLocation':True,'aliases':['brown paper lunch bag','lunch sack','paper lunch sack','brown bag'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':4,'wetRetention':'very_high','dirtRetention':'low'},
          {'id':'gc2364','name':'Plastic Produce Bag','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':0.0062,'price':0.01,'availability':'Ubiquitous','colors':['Clear'],'specs':'Thin clear HDPE produce bag from a grocery-store roll · Representative size about 12 × 20 in and thickness about 9 microns · Empty weight about 0.006 lb (0.1 oz) · Open top; intended for produce and other light food items','createsLocation':True,'aliases':['produce bag','grocery produce bag','produce sack','produce roll bag'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':5,'wetRetention':'very_low','dirtRetention':'low'},
          {'id':'gc2365','name':'Zip-Top Storage Bag, Sandwich','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':0.006,'price':0.04,'availability':'Ubiquitous','colors':['Clear'],'specs':'Resealable LDPE sandwich-size food-storage bag, approximately 6.5 × 5.9 in · About 1 mil thick with interlocking zip closure · Empty weight about 0.006 lb (0.1 oz) · Not intended as a dependable liquid container','createsLocation':True,'aliases':['sandwich bag','zipper sandwich bag','zip bag','ziplock bag','Ziploc bag','resealable sandwich bag'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':2,'wetRetention':'very_low','dirtRetention':'low'},
          {'id':'gc2366','name':'Zip-Top Storage Bag, Gallon','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':0.022,'price':0.08,'availability':'Ubiquitous','colors':['Clear'],'specs':'Resealable 1-gallon LDPE food-storage bag, approximately 10.6 × 10.75 in · About 1.7 mil thick with double zipper and write-on area · Empty weight about 0.022 lb (0.35 oz) · Not intended as a dependable liquid container','createsLocation':True,'aliases':['gallon storage bag','gallon zip bag','zipper gallon bag','ziplock gallon bag','Ziploc gallon bag','resealable gallon bag'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':5,'wetRetention':'very_low','dirtRetention':'low'}]
          idx=next(i for i,x in enumerate(cat) if x['id']=='gc0553')
          for item in cheap:
              assert item['id'] not in byid and item['name'] not in byname
          cat[idx:idx]=cheap
          coolers=[
          {'id':'gc2367','name':'Cooler, Hard, 16-Quart','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':3.6,'price':30.0,'availability':'Common','colors':['Blue','Gray','Red','White'],'specs':'Small portable hard-sided cooler · 16 qt / 15 L class · Representative empty weight about 3.6 lb · Typical capacity around 11 standard cans plus 8 lb of ice · Bail handle for one-handed carrying','createsLocation':True,'aliases':['16 quart cooler','16 qt cooler','small hard cooler','portable cooler'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':25,'wetRetention':'very_low','dirtRetention':'low'},
          {'id':'gc2368','name':'Cooler, Hard, 48-Quart','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':8.1,'price':55.0,'availability':'Common','colors':['Blue','Gray','Red','White'],'specs':'Medium-large hard-sided cooler · 48 qt / 45 L class · Representative empty weight about 8.1 lb · Typical capacity up to roughly 76 standard cans · Dual swing handles and drain plug common in this size','createsLocation':True,'aliases':['48 quart cooler','48 qt cooler','large hard cooler'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':75,'wetRetention':'very_low','dirtRetention':'low'},
          {'id':'gc2369','name':'Cooler, Hard, 70-Quart','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':11.4,'price':95.0,'availability':'Common','colors':['Blue','Gray','Red','White'],'specs':'Large hard-sided camping / group cooler · 70 qt / 66 L class · Representative empty weight about 11.4 lb · Typical capacity around 50 cans plus 35 lb of ice, with some models rated for more than 100 cans without ice · Drain plug and reinforced carry handles','createsLocation':True,'aliases':['70 quart cooler','70 qt cooler','extra large cooler','large camping cooler'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':100,'wetRetention':'very_low','dirtRetention':'low'},
          {'id':'gc2370','name':'Lunch Bag, Insulated','category':'Food, Water & Cooking','subcategory':'Utensils & Storage','weight':0.26,'price':20.0,'availability':'Common','colors':['Black','Blue','Gray','Green','Pink','Purple','Red','Teal'],'specs':'Personal soft-sided insulated lunch bag with leak-resistant liner, zipper closure, carry handle / shoulder strap, and small accessory pocket · Representative capacity about 9 standard cans · Representative empty weight about 0.26 lb','createsLocation':True,'aliases':['insulated lunch box','lunch box','lunchbox','lunch cooler','lunch pail','soft lunch cooler'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':10,'wetRetention':'low','dirtRetention':'moderate'},
          {'id':'gc2371','name':'Organ Transport Cooler, Medical','category':'Medical & First Aid','subcategory':'Clinical Supplies','weight':9.3,'price':600.0,'availability':'Specialty','colors':['Blue'],'specs':'Validated reusable medical cold-chain transport carrier suitable for temperature-sensitive tissue, blood products, biologics, and organ transport when consistent with clinical protocol · Representative 3 L model weighs about 9.3 lb and uses six phase-change panels to maintain approximately 2–8 °C for 48+ hours without powered refrigeration · Washable insulated shell, leak-resistant removable liner, secure zipper/buckle closure, and document/data-logger pocket · Not a machine-perfusion organ preservation system','createsLocation':True,'aliases':['organ cooler','organ transplant cooler','organ transport box','transplant cooler','medical transport cooler','medical cold chain cooler','tissue transport cooler'],'unit':'each','defaultQuantity':1,'locationCapacityPounds':8,'wetRetention':'low','dirtRetention':'low'}]
          idx=next(i for i,x in enumerate(cat) if x['id']=='gc0555')+1
          cat[idx:idx]=coolers[:4]
          clinical_idxs=[i for i,x in enumerate(cat) if x['category']=='Medical & First Aid' and x['subcategory']=='Clinical Supplies']
          assert clinical_idxs
          cat.insert(max(clinical_idxs)+1,coolers[4])
          t=t[:s]+json.dumps(cat,separators=(',',':'),ensure_ascii=False)+t[e:]
          assert t.count('Character Sheet v544')==1
          t=t.replace('Character Sheet v544','Character Sheet v545',1)
          p.write_text(t,encoding='utf-8')
          text=p.read_text(encoding='utf-8')
          s=text.index(marker)+len(marker)
          e=text.index(';\n',s)
          final=json.loads(text[s:e])
          ids=[x['id'] for x in final]
          names=[x['name'] for x in final]
          assert len(ids)==len(set(ids))
          assert len(names)==len(set(names))
          for iid in [f'gc{x}' for x in range(2361,2372)]:
              assert iid in ids
          assert 'Kitchen Trash Bag' in next(x for x in final if x['id']=='gc0767')['aliases']
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          assert len(scripts)==1
          Path('/tmp/v545.js').write_text(scripts[0],encoding='utf-8')
          PY
          echo '1bcfc78db8cc0ce5716f1df9db8bd8521b079cc867336ac8c18451073a247449  index.html' | sha256sum -c -
          test "$(git hash-object index.html)" = "cd1d47703a8b781ab8294bae6f82c9515c6c397c"
          test "$(wc -c < index.html)" -eq 2344878
          grep -q 'Character Sheet v545' index.html
          node --check /tmp/v545.js
      - name: Commit v545 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT GitHub Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-v545.yml
          git add index.html
          git commit -m 'Update index.html to v545'
          git push origin HEAD:main