name: Promote exact full v537

on:
  push:
    paths:
      - '.github/workflows/promote-v537.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact v536 base
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          let t = fs.readFileSync('index-v534-base.html', 'utf8');
          const patch = JSON.parse(zlib.gunzipSync(fs.readFileSync('v536-patch.json.gz')).toString('utf8'));
          if (!t.includes(patch.baseVersion)) throw new Error('Unexpected base version');
          const marker = 'const GEAR_CATALOG = ';
          const s = t.indexOf(marker) + marker.length;
          const e = t.indexOf(';\n', s);
          const catalog = JSON.parse(t.slice(s, e));
          const byId = new Map(catalog.map(x => [x.id, x]));
          for (const [id, fields] of Object.entries(patch.changes)) {
            const item = byId.get(id);
            if (!item) throw new Error('Missing catalog item ' + id);
            Object.assign(item, fields);
          }
          for (const [id, keys] of Object.entries(patch.remove || {})) {
            const item = byId.get(id);
            if (!item) throw new Error('Missing remove item ' + id);
            for (const key of keys) delete item[key];
          }
          const ai = catalog.findIndex(x => x.id === patch.insertAfter);
          if (ai < 0) throw new Error('Insertion anchor missing');
          catalog.splice(ai + 1, 0, ...patch.newItems);
          t = t.slice(0, s) + JSON.stringify(catalog) + t.slice(e);
          for (const [a, b] of patch.outside) {
            const i = t.indexOf(a);
            if (i < 0) throw new Error('UI patch anchor not found');
            t = t.slice(0, i) + b + t.slice(i + a.length);
          }
          if (!t.includes(patch.targetVersion)) throw new Error('Target version marker missing');
          fs.writeFileSync('/tmp/v536.html', t, 'utf8');
          NODE
          echo '132106a7120c40f8d250990d9dc63a634117f668dbe392e9f96d0e5457d045e5  /tmp/v536.html' | sha256sum -c -

      - name: Reconstruct exact full v537
        shell: bash
        run: |
          cat > /tmp/v536-to-v537.zstpatch.b64 <<'B64'
          
          B64
          base64 -d /tmp/v536-to-v537.zstpatch.b64 > /tmp/v536-to-v537.zstpatch
          zstd -q -d --patch-from=/tmp/v536.html /tmp/v536-to-v537.zstpatch -o index.html
          echo '0f67a69bfe58131bff98e5a974e938002141cb261762d1582dee99d438395463  index.html' | sha256sum -c -
          test "$(wc -c < index.html)" -eq 2318393

      - name: Commit standalone v537
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f index-v534-base.html v536-patch.json.gz
          git add index.html
          git commit -m 'Publish full standalone v537'
          git push
