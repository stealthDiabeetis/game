name: Apply v525 ultralight and gear hover update
on:
  push:
    paths:
      - '.github/workflows/apply-v525.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v525
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "f391651ef65e389063ac91bc3162e2aff31484a3"
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'const GEAR_CATALOG = (\[.*?\]);\n', s, re.S)
          if not m:
              raise SystemExit('GEAR_CATALOG not found')
          cat=json.loads(m.group(1))
          byid={x['id']:x for x in cat}
          byid['gc0090'].update({
              'weight':2.0,
              'price':275.0,
              'specs':'Volume: 50 L · Practical Load: 30 lb · Framed ultralight pack with minimalist suspension and lightweight ripstop construction; optimized for low base weight',
              'locationCapacityPounds':30.0
          })
          byid['gc0091'].update({
              'weight':2.1,
              'price':330.0,
              'specs':'Volume: 55 L · Practical Load: 35 lb · Framed ultralight pack with adjustable torso fit and ventilated suspended-mesh back panel; more supportive suspension than minimalist ultralight designs',
              'locationCapacityPounds':35.0
          })
          s=s[:m.start(1)] + json.dumps(cat,separators=(',',':'),ensure_ascii=False) + s[m.end(1):]
          old="""      const stockWeightLocked = Boolean(!draft && catalogForGearInstance(g));
          const displayWeightLocked = Boolean(!draft && (stockWeightLocked || loadedBreakdown?.isContainer));
          const currentWeightTitle = draft ? '' : gearDisplayedWeightTitle(g, weightUnit);"""
          new="""      const catalogItem = draft ? null : catalogForGearInstance(g);
          const stockWeightLocked = Boolean(catalogItem);
          const displayWeightLocked = Boolean(!draft && (stockWeightLocked || loadedBreakdown?.isContainer));
          const itemSpecsTitle = String(catalogItem?.specs || '').trim();
          const currentWeightTitle = draft ? '' : gearDisplayedWeightTitle(g, weightUnit);"""
          if old not in s:
              raise SystemExit('gear row catalog marker not found')
          s=s.replace(old,new,1)
          old_input="""<td class="gear-item-col"><div class="gear-item-input-wrap">${dragControl}<input value="${esc(g.item)}" data-field="item" placeholder="${draft ? 'Add item…' : 'Item'}" autocomplete="off" aria-autocomplete="list" aria-controls="gearItemAutocompleteMenu" aria-expanded="false"><span class="gear-print-value print-only">${esc(g.item || '')}</span></div></td>"""
          new_input="""<td class="gear-item-col"${itemSpecsTitle ? ` title="${esc(itemSpecsTitle)}"` : ''}><div class="gear-item-input-wrap">${dragControl}<input value="${esc(g.item)}" data-field="item" placeholder="${draft ? 'Add item…' : 'Item'}" autocomplete="off" aria-autocomplete="list" aria-controls="gearItemAutocompleteMenu" aria-expanded="false"${itemSpecsTitle ? ` title="${esc(itemSpecsTitle)}"` : ''}><span class="gear-print-value print-only">${esc(g.item || '')}</span></div></td>"""
          if old_input not in s:
              raise SystemExit('gear item input marker not found')
          s=s.replace(old_input,new_input,1)
          if s.count('Character Sheet v524') != 1:
              raise SystemExit('v524 footer not found exactly once')
          s=s.replace('Character Sheet v524','Character Sheet v525')
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "ce6fbed33a4bfe163825d5a69b790f910f68cb14"
          rm .github/workflows/apply-v525.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-v525.yml
          git commit -m "Update ultralight packs and gear hover specs (v525)"
          git push origin main
          # retrigger
