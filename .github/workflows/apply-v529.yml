name: Apply v529

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v529.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add handheld EMF meter
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          path = Path('index.html')
          text = path.read_text()
          assert 'Character Sheet v528' in text, 'Expected v528 baseline'

          prefix = 'const GEAR_CATALOG = '
          start = text.index(prefix) + len(prefix)
          end = text.index(';\n', start)
          catalog = json.loads(text[start:end])
          assert not any(item.get('id') == 'gc2246' for item in catalog), 'gc2246 already exists'

          new_item = {
              'id':'gc2246',
              'name':'EMF Meter, Handheld',
              'category':'Tools & Hardware',
              'subcategory':'Scientific & Field Equipment > Field Measurement',
              'weight':0.75,
              'price':185.0,
              'availability':'Specialty',
              'colors':['Black'],
              'specs':'Handheld 3-in-1 electromagnetic-field meter measuring AC magnetic fields, AC electric fields, and RF/microwave power density · Representative range: magnetic 40 Hz–100 kHz, electric 40 Hz–100 kHz, RF 20 MHz–6 GHz',
              'createsLocation':False,
              'aliases':['EMF','EMF detector','electromagnetic field meter','electromagnetic field detector','gaussmeter','gauss meter','RF meter'],
              'unit':'each',
              'defaultQuantity':1
          }

          insert_at = next(i for i,item in enumerate(catalog) if item.get('id') == 'gc0745') + 1
          catalog.insert(insert_at, new_item)
          new_catalog = json.dumps(catalog, ensure_ascii=False, separators=(',',':'))
          text = text[:start] + new_catalog + text[end:]
          text = text.replace('Character Sheet v528', 'Character Sheet v529', 1)
          path.write_text(text)
          PY
          git diff --check
          grep -q '"name":"EMF Meter, Handheld"' index.html
          grep -q '"aliases":\["EMF","EMF detector"' index.html
          grep -q 'Character Sheet v529' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-v529.yml
          git add index.html .github/workflows/apply-v529.yml
          git commit -m 'Add handheld EMF meter (v529)'
          git push
