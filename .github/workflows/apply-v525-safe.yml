name: Apply v525 safe
on:
  push:
    paths:
      - '.github/workflows/apply-v525-safe.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v525
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "f391651ef65e389063ac91bc3162e2aff31484a3"
          python - <<'PY'
          from pathlib import Path
          import re, json, base64
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'const GEAR_CATALOG = (\[.*?\]);\n', s, re.S)
          if not m: raise SystemExit('catalog not found')
          cat=json.loads(m.group(1)); byid={x['id']:x for x in cat}
          byid['gc0090'].update({'weight':2.0,'price':275.0,'specs':'Volume: 50 L · Practical Load: 30 lb · Framed ultralight pack with minimalist suspension and lightweight ripstop construction; optimized for low base weight','locationCapacityPounds':30.0})
          byid['gc0091'].update({'weight':2.1,'price':330.0,'specs':'Volume: 55 L · Practical Load: 35 lb · Framed ultralight pack with adjustable torso fit and ventilated suspended-mesh back panel; more supportive suspension than minimalist ultralight designs','locationCapacityPounds':35.0})
          s=s[:m.start(1)] + json.dumps(cat,separators=(',',':'),ensure_ascii=False) + s[m.end(1):]
          pairs=[
          ('',''),
          ('','')]
          for a,b in pairs:
              old=base64.b64decode(a).decode(); new=base64.b64decode(b).decode()
              if old not in s: raise SystemExit('replacement marker missing')
              s=s.replace(old,new,1)
          if s.count('Character Sheet v524') != 1: raise SystemExit('footer mismatch')
          s=s.replace('Character Sheet v524','Character Sheet v525')
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "ce6fbed33a4bfe163825d5a69b790f910f68cb14"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ultralight packs and gear hover specs (v525)"
          git push origin main
