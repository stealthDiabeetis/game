name: Apply v528

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v528.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested v528 patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          
          path = Path("index.html")
          text = path.read_text()
          assert "Character Sheet v526" in text, "Expected v526 baseline"
          
          prefix = "const GEAR_CATALOG = "
          start = text.index(prefix) + len(prefix)
          end = text.index(";\n", start)
          catalog = json.loads(text[start:end])
          
          updates = json.loads("{\"gc1336\":{\"id\":\"gc1336\",\"name\":\"Emergency Group Shelter, 4-Person\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Bivies & Emergency Shelters\",\"weight\":1.1,\"price\":80.0,\"availability\":\"Specialty\",\"colors\":[\"Orange\",\"Red\",\"Camo Green\",\"Camo Tan\",\"Green\",\"Tan\",\"White\"],\"specs\":\"Bothy-style emergency group shelter for roughly 4 people · Windproof and waterproof temporary cover supported by the occupants rather than tent poles · Intended for storm stops and emergencies, not sleeping accommodation\",\"createsLocation\":false,\"aliases\":[\"bothy bag\",\"bothy shelter\",\"group bothy\"],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"},\"gc0315\":{\"id\":\"gc0315\",\"name\":\"Tent, Backpacking, 1-Person\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Tents\",\"weight\":1.94,\"price\":250.0,\"availability\":\"Specialty\",\"colors\":[\"Camo Green\",\"Camo Tan\",\"Green\",\"Gray\",\"Tan\",\"White\"],\"specs\":\"3-season ultralight trekking-pole backpacking tent · Person Rating: 1 · Practical Sleeper Height: about 6 ft 3 in · Peak Height: about 45 in · Trekking poles required; excellent space-to-weight efficiency\",\"createsLocation\":false,\"aliases\":[\"ultralight one-person tent\"],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"},\"gc0316\":{\"id\":\"gc0316\",\"name\":\"Tent, Backpacking, 2-Person\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Tents\",\"weight\":2.14375,\"price\":319,\"availability\":\"Specialty\",\"colors\":[\"Camo Green\",\"Camo Tan\",\"Green\",\"Gray\",\"Tan\",\"White\"],\"specs\":\"3-season ultralight double-wall trekking-pole backpacking tent · Person Rating: 2 · Practical Sleeper Height: about 6 ft 4 in · Peak Height: 48 in · Requires 2 trekking poles; poles not included · Unusually spacious for its packed weight\",\"createsLocation\":false,\"aliases\":[\"two-person trekking-pole tent\"],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"},\"gc0317\":{\"id\":\"gc0317\",\"name\":\"Tent, Backpacking, 3-Person\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Tents\",\"weight\":4.8,\"price\":450.0,\"availability\":\"Specialty\",\"colors\":[\"Black\",\"Blue\",\"Camo Green\",\"Camo Tan\",\"Gray\",\"Green\",\"Orange\",\"Red\",\"Tan\",\"White\"],\"specs\":\"3-season lightweight freestanding backpacking tent · Person Rating: 3 · Practical Sleeper Height: about 6 ft 2 in · Peak Height: 46 in · Strong shared-weight value for a small group\",\"createsLocation\":false,\"aliases\":[],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"},\"gc0318\":{\"id\":\"gc0318\",\"name\":\"Tent, Camping, 4-Person\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Tents\",\"weight\":7.9,\"price\":40,\"availability\":\"Specialty\",\"colors\":[\"Black\",\"Blue\",\"Gray\",\"Green\",\"Orange\",\"Red\",\"Tan\"],\"specs\":\"Budget summer car-camping dome tent with rainfly and carry bag · Person Rating: 4 · Practical Sleeper Height: about 6 ft 2 in · Peak Height: 50 in · Fits a queen air mattress; very low cost but much heavier and bulkier than backpacking tents\",\"createsLocation\":false,\"aliases\":[],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"},\"gc0319\":{\"id\":\"gc0319\",\"name\":\"Tent, Camping, 6-Person\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Tents\",\"weight\":14.0,\"price\":80,\"availability\":\"Specialty\",\"colors\":[\"Black\",\"Blue\",\"Gray\",\"Green\",\"Orange\",\"Red\",\"Tan\"],\"specs\":\"Budget summer car-camping dome tent with rainfly and carry bag · Person Rating: 6 · Practical Sleeper Height: about 6 ft 6 in · Peak Height: 72 in · Fits up to two queen air mattresses; near-standing center height at very low cost\",\"createsLocation\":false,\"aliases\":[],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"}}")
          new_items = json.loads("[{\"id\":\"gc2242\",\"name\":\"Tent, Backpacking, 4-Person\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Tents\",\"weight\":5.5,\"price\":850.0,\"availability\":\"Specialty\",\"colors\":[\"Camo Green\",\"Camo Tan\",\"Green\",\"Gray\",\"Orange\",\"Tan\",\"White\"],\"specs\":\"3-season premium freestanding backpacking tent · Person Rating: 4 · Practical Sleeper Height: about 6 ft 6 in · Peak Height: 50 in · Expensive, but excellent per-person packed weight for a true four-person shelter\",\"createsLocation\":false,\"aliases\":[\"four-person backpacking tent\",\"4-person backpacking tent\"],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"},{\"id\":\"gc2243\",\"name\":\"Tent, Winter, 2-Person\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Tents\",\"weight\":6.5625,\"price\":550.0,\"availability\":\"Specialty\",\"colors\":[\"Camo Green\",\"Camo Tan\",\"Green\",\"Gray\",\"Orange\",\"Tan\",\"White\"],\"specs\":\"4-season winter backpacking tent · Person Rating: 2 · Practical Sleeper Height: about 6 ft 2 in · Peak Height: 42 in · Freestanding and substantially more weather-resistant than a 3-season tent; built for winter camping short of full expedition use\",\"createsLocation\":false,\"aliases\":[\"4-season backpacking tent\",\"winter backpacking tent\"],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"},{\"id\":\"gc2244\",\"name\":\"Tent, Expedition, 2-Person\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Tents\",\"weight\":9.4375,\"price\":1050.0,\"availability\":\"Specialty\",\"colors\":[\"Camo Green\",\"Camo Tan\",\"Gray\",\"Green\",\"Orange\",\"Red\",\"Tan\",\"White\"],\"specs\":\"4-season expedition/mountaineering tent · Person Rating: 2 · Practical Sleeper Height: about 6 ft 4 in · Peak Height: 38 in · Heavy-duty multi-pole freestanding structure built for severe alpine wind and snow rather than low carried weight\",\"createsLocation\":false,\"aliases\":[\"mountaineering expedition tent\",\"4-season expedition tent\"],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"},{\"id\":\"gc2245\",\"name\":\"Thermal-Signature Cover, Blanket\",\"category\":\"Outdoor & Survival\",\"subcategory\":\"Shelter > Accessories & Repair\",\"weight\":3.3,\"price\":250.0,\"availability\":\"Specialty\",\"colors\":[\"Camo Green\",\"Camo Tan\",\"Green\",\"Tan\",\"Multicolor\"],\"specs\":\"Reusable anti-thermal concealment blanket for a person, gear, or small shelter · Roughly 4.5 × 8 ft class · Designed to reduce thermal contrast and break up the visible outline; does not make the covered subject thermally invisible\",\"createsLocation\":false,\"aliases\":[\"anti-thermal blanket\",\"thermal camouflage blanket\",\"IR camouflage blanket\",\"thermal signature cover\"],\"unit\":\"each\",\"defaultQuantity\":1,\"wetRetention\":\"low\",\"dirtRetention\":\"moderate\"}]")
          
          by_id = {item["id"]: i for i, item in enumerate(catalog)}
          for item_id, replacement in updates.items():
              assert item_id in by_id, f"Missing expected item {item_id}"
              catalog[by_id[item_id]] = replacement
          
          for item in new_items:
              assert item["id"] not in by_id, f"Item already exists: {item['id']}"
          
          insert_at = next(i for i,item in enumerate(catalog) if item["id"] == "gc0319") + 1
          catalog[insert_at:insert_at] = new_items
          new_catalog = json.dumps(catalog, ensure_ascii=False, separators=(",",":"))
          text = text[:start] + new_catalog + text[end:]
          
          replacements = [
              ("Character Sheet v526", "Character Sheet v528"),
              ("    'navy blue':'Navy Blue',\n    multicolor:'Multicolor',",
               "    'navy blue':'Navy Blue',\n    'camo green':'Camo Green',\n    'camo tan':'Camo Tan',\n    multicolor:'Multicolor',"),
              ("    'Black','Blue','Brass','Brown','Clear','Copper','Gold','Gray','Green','Multicolor','Navy Blue',",
               "    'Black','Blue','Brass','Brown','Camo Green','Camo Tan','Clear','Copper','Gold','Gray','Green','Multicolor','Navy Blue',"),
              ("    Black:'#111111', Blue:'#2f6fed', Brass:'#b5a642', Brown:'#79543a', Clear:'clear',",
               "    Black:'#111111', Blue:'#2f6fed', Brass:'#b5a642', Brown:'#79543a', 'Camo Green':'repeating-linear-gradient(135deg,#304b32 0 5px,#556b3f 5px 10px,#6d7442 10px 15px,#3e5538 15px 20px)', 'Camo Tan':'repeating-linear-gradient(135deg,#8a6d46 0 5px,#b59a6a 5px 10px,#6f5a3d 10px 15px,#c1aa7a 15px 20px)', Clear:'clear',"),
          ]
          for old,new in replacements:
              count = text.count(old)
              assert count == 1, f"Expected one match, found {count}: {old[:60]}"
              text = text.replace(old,new)
          
          path.write_text(text)
          PY
          git diff --check
          grep -q "Character Sheet v528" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-v528.yml
          git add index.html .github/workflows/apply-v528.yml
          git commit -m "Apply shelter and tent updates (v528)"
          git push
