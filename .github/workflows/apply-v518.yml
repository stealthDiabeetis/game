name: Apply v518 cellular camera additions

on:
  push:
    paths:
      - .github/workflows/apply-v518.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add cellular camera options
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "510e59737d5cdad774a9f334f9e91dc585fee2b5"
          python - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'const GEAR_CATALOG = (\[.*?\]);\n', s, re.S)
          if not m: raise SystemExit('GEAR_CATALOG not found')
          cat=json.loads(m.group(1))
          if any(x.get('id') in {'gc2238','gc2239'} for x in cat): raise SystemExit('new IDs already exist')
          new_items=[
            {'id':'gc2238','name':'Covert Camera, Cellular, 4K','category':'Electronics & Communications','subcategory':'Surveillance & Counter-Surveillance','weight':0.4,'price':400.0,'availability':'Specialty','colors':['Black','Multicolor'],'specs':'Covert 4K camera system with miniature camera head, motion detection, and 940 nm no-glow IR night vision · Storage/Signal: local microSD recording plus 4G cellular remote alerts/live view and Wi-Fi setup; remote cellular streaming may use lower resolution than 4K local recording','createsLocation':False,'aliases':['4K covert camera','cellular covert camera','4G covert camera','LTE covert camera','covert camera system'],'unit':'each','defaultQuantity':1},
            {'id':'gc2239','name':'Trail Camera, Cellular, 4K','category':'Electronics & Communications','subcategory':'Surveillance & Counter-Surveillance','weight':0.8,'price':140.0,'availability':'Common','colors':['Green','Tan','Multicolor'],'specs':'4K motion-triggered outdoor trail camera with PIR detection, 940 nm no-glow IR night vision, and weather-resistant housing · Storage/Signal: local SD/SDHC storage plus 4G cellular photo/video delivery and remote configuration; no Wi-Fi required in the field','createsLocation':False,'aliases':['cellular trail camera','4G trail camera','LTE trail camera','4K trail camera','game camera cellular'],'unit':'each','defaultQuantity':1}
          ]
          idx=next((i for i,x in enumerate(cat) if x.get('id')=='gc2237'), None)
          if idx is None: idx=next(i for i,x in enumerate(cat) if x.get('id')=='gc1835')
          for off,item in enumerate(new_items, start=1): cat.insert(idx+off,item)
          new_json=json.dumps(cat,separators=(',',':'),ensure_ascii=False)
          out=s[:m.start(1)] + new_json + s[m.end(1):]
          out=out.replace('Character Sheet v517</div>', 'Character Sheet v518</div>', 1)
          p.write_text(out)
          PY
          test "$(git hash-object index.html)" = "e5d49b9fa49248eadb8cb03ed3c04c6538e56a9d"
          rm .github/workflows/apply-v518.yml
          git config user.name "ChatGPT GitHub Integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-v518.yml
          git commit -m "Add cellular 4K camera options (v518)"
          git push origin HEAD:main
