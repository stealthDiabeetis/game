name: Apply v532

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v532.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v532 package quantity fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          path = Path('index.html')
          text = path.read_text()
          assert 'Character Sheet v531' in text, 'Expected v531 baseline'

          prefix = 'const GEAR_CATALOG = '
          start = text.index(prefix) + len(prefix)
          end = text.index(';\n', start)
          catalog = json.loads(text[start:end])
          by_id = {item['id']: item for item in catalog}

          butterfly = by_id['gc0399']
          butterfly.update({
              'price': 6.99 / 10,
              'defaultQuantity': 10,
              'specs': 'Reinforced adhesive butterfly wound-closure strip, approx. 1/4 × 3 in · Common retail package quantity: 10'
          })

          chlorine = by_id['gc0528']
          chlorine.update({
              'weight': 0.001875,
              'price': 17.95 / 30,
              'defaultQuantity': 30,
              'specs': 'Individually foil-wrapped chlorine-dioxide water-treatment tablet · Treats about 1 L · Common retail package quantity: 30'
          })

          assert round(butterfly['price'] * butterfly['defaultQuantity'], 2) == 6.99
          assert round(chlorine['price'] * chlorine['defaultQuantity'], 2) == 17.95
          assert round(chlorine['weight'] * chlorine['defaultQuantity'] * 16, 2) == 0.90

          text = text[:start] + json.dumps(catalog, ensure_ascii=False, separators=(',', ':')) + text[end:]
          text = text.replace('Character Sheet v531', 'Character Sheet v532', 1)
          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-v532.yml
          git add index.html .github/workflows/apply-v532.yml
          git commit -m "Fix retail package quantities (v532)"
          git push
