name: Apply v531
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v531.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v531 measurement audit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json,zlib,base64
          path=Path("index.html")
          text=path.read_text()
          assert "Character Sheet v530" in text
          prefix="const GEAR_CATALOG = "
          start=text.index(prefix)+len(prefix); end=text.index(";\n",start)
          catalog=json.loads(text[start:end])
          changed=json.loads(zlib.decompress(base64.b64decode("")))
          added=json.loads(zlib.decompress(base64.b64decode("")))
          by_id={x["id"]:i for i,x in enumerate(catalog)}
          for k,v in changed.items():
              assert k in by_id
              catalog[by_id[k]]=v
          existing={x["id"] for x in catalog}
          assert all(x["id"] not in existing for x in added)
          at=next(i for i,x in enumerate(catalog) if x["id"]=="gc2246")+1
          catalog[at:at]=added
          text=text[:start]+json.dumps(catalog,ensure_ascii=False,separators=(",",":"))+text[end:]
          text=text.replace("Character Sheet v530","Character Sheet v531",1)
          path.write_text(text)
          PY
          git diff --check
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');for(const m of s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi))new Function(m[1]);"
          grep -q "Character Sheet v531" index.html
          rm .github/workflows/apply-v531.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-v531.yml
          git commit -m "Add measurement tools and pricing fixes (v531)"
          git push
