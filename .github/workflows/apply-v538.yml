name: Apply v538 combat camouflage update

on:
  push:
    paths:
      - .github/workflows/apply-v538.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact v538 changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "cf8c07af692051ce39d09a6940f528434e18d259"
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          t = p.read_text()

          old = '<div class="footer-note no-print">Character Sheet v537</div>'
          new = '<div class="footer-note no-print">Character Sheet v538</div>'
          if t.count(old) != 1: raise SystemExit('v537 footer anchor mismatch')
          t = t.replace(old, new, 1)

          marker = 'const GEAR_CATALOG = '
          s = t.index(marker) + len(marker)
          e = t.index(';\n', s)
          catalog = json.loads(t[s:e])
          colors = {
              'gc0017':['Black','Brown','Gray','Green','Tan','Camo Green','Camo Tan','Transitional Camo'],
              'gc0018':['Brown','Gray','Green','Tan','Camo Green','Camo Tan','Transitional Camo'],
              'gc1631':['Black','Brown','Gray','Green','Tan','Camo Green','Camo Tan','Transitional Camo'],
              'gc1632':['Brown','Gray','Green','Tan','Camo Green','Camo Tan','Transitional Camo'],
          }
          seen = set()
          for item in catalog:
              if item.get('id') in colors:
                  item['colors'] = colors[item['id']]
                  seen.add(item['id'])
          if seen != set(colors): raise SystemExit(f'Combat uniform IDs mismatch: {seen}')
          t = t[:s] + json.dumps(catalog, separators=(',', ':'), ensure_ascii=False) + t[e:]

          replacements = [
              ("    'camo green':'Camo Green',\n    'camo tan':'Camo Tan',\n    multicolor:'Multicolor',",
               "    'camo green':'Camo Green',\n    'camo tan':'Camo Tan',\n    'transitional camo':'Transitional Camo',\n    multicam:'Transitional Camo',\n    'multi cam':'Transitional Camo',\n    multicolor:'Multicolor',"),
              ("const neutralTactical = ['Black','Gray','Green','Tan','Brown','Navy Blue'].includes(color);",
               "const neutralTactical = ['Black','Gray','Green','Tan','Brown','Navy Blue','Camo Green','Camo Tan','Transitional Camo'].includes(color);"),
              ("    'Black','Blue','Brass','Brown','Camo Green','Camo Tan','Clear','Copper','Gold','Gray','Green','Multicolor','Navy Blue',",
               "    'Black','Blue','Brass','Brown','Camo Green','Camo Tan','Transitional Camo','Clear','Copper','Gold','Gray','Green','Multicolor','Navy Blue',"),
              ("    Black:'#111111', Blue:'#2f6fed', Brass:'#b5a642', Brown:'#79543a', 'Camo Green':'repeating-linear-gradient(135deg,#304b32 0 5px,#556b3f 5px 10px,#6d7442 10px 15px,#3e5538 15px 20px)', 'Camo Tan':'repeating-linear-gradient(135deg,#8a6d46 0 5px,#b59a6a 5px 10px,#6f5a3d 10px 15px,#c1aa7a 15px 20px)', Clear:'clear',",
               "    Black:'#111111', Blue:'#2f6fed', Brass:'#b5a642', Brown:'#79543a', 'Camo Green':'repeating-linear-gradient(135deg,#304b32 0 5px,#556b3f 5px 10px,#6d7442 10px 15px,#3e5538 15px 20px)', 'Camo Tan':'repeating-linear-gradient(135deg,#8a6d46 0 5px,#b59a6a 5px 10px,#6f5a3d 10px 15px,#c1aa7a 15px 20px)', 'Transitional Camo':'repeating-linear-gradient(135deg,#5f6841 0 4px,#8b7a4f 4px 8px,#a48b5b 8px 12px,#4b5838 12px 16px,#796647 16px 20px,#b19b6d 20px 24px)', Clear:'clear',"),
          ]
          for old, new in replacements:
              if t.count(old) != 1: raise SystemExit('Expected exactly one replacement anchor')
              t = t.replace(old, new, 1)

          p.write_text(t)
          PY
          echo 'ea2f6470d47f7c6bd3a2bf6ac707024fa6c2b7a11d884c7071f1cf04aed2f20f  index.html' | sha256sum -c -
          test "$(git hash-object index.html)" = "9e0bb83409ed19593cf47608a2a49e34ff9c2f35"
          grep -q 'Character Sheet v538' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          if len(scripts) != 1: raise SystemExit(f'Expected 1 inline script, found {len(scripts)}')
          Path('/tmp/index-script.js').write_text(scripts[0])
          PY
          node --check /tmp/index-script.js
      - name: Commit v538 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT GitHub Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-v538.yml
          git add index.html
          git commit -m 'Update index.html to v538'
          git push origin HEAD:main
