name: PR trigger v537 promotion

on:
  pull_request:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    if: contains(github.event.pull_request.title, '[promote-v537]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact v537 promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-v537.yml --repo "$GITHUB_REPOSITORY" --ref main
