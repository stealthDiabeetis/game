name: Apply v530

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v530.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v530 instrumentation patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          exec(gzip.decompress(base64.b64decode(payload)).decode(), {})
          PY
          git diff --check
          grep -q "Character Sheet v530" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-v530.yml
          git add index.html .github/workflows/apply-v530.yml
          git commit -m "Add professional telecom and inspection tools (v530)"
          git push
