name: Apply v524 daypack audit
on:
  push:
    paths:
      - '.github/workflows/apply-v524.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v524
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "5db521d51fc1ed3d57b6f336117258e3116aa510"
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'const GEAR_CATALOG = (\[.*?\]);\n', s, re.S)
          if not m:
              raise SystemExit('GEAR_CATALOG not found')
          cat=json.loads(m.group(1))
          byid={x['id']:x for x in cat}
          updates={
              'gc0085':{
                  'weight':1.1,'price':80.0,'locationCapacityPounds':20.0,
                  'specs':'Volume: 15 L · Practical Load: 20 lb · Lightweight technical hiking daypack with foam framesheet, ventilated close-to-body backpanel, padded hipwings, compression straps, and durable high-tenacity ripstop construction · Hydration compatible; reservoir not included'
              },
              'gc0086':{
                  'weight':1.74,'price':140.0,'locationCapacityPounds':20.0,
                  'specs':'Volume: 22 L · Practical Load: 20 lb · Lightweight hiking/hydration daypack with supportive foam framesheet, ventilated backpanel, contoured padded harness, and durable high-tenacity nylon construction · Includes 2.5 L hydration reservoir, drinking tube, and bite valve'
              },
              'gc0087':{
                  'weight':2.25,'price':130.0,'locationCapacityPounds':25.0,
                  'specs':'Volume: 25 L · Practical Load: 25 lb · Structured technical hiking daypack with injection-molded framesheet, adjustable torso fit, ventilated close-to-body backpanel, padded load-transferring hipbelt, load lifters, compression straps, and durable high-tenacity ripstop construction · Hydration compatible; reservoir not included'
              },
              'gc0088':{
                  'weight':2.9,'price':190.0,'locationCapacityPounds':30.0,
                  'specs':'Volume: 30 L · Practical Load: 30 lb · Premium structured hiking daypack with suspended-mesh ventilation, internal/perimeter frame, padded load-transferring hipbelt, load lifters, adjustable harness, and rain cover · Hydration compatible; reservoir not included'
              }
          }
          for iid,u in updates.items():
              if iid not in byid:
                  raise SystemExit(f'missing {iid}')
              byid[iid].update(u)
          s=s[:m.start(1)] + json.dumps(cat,separators=(',',':'),ensure_ascii=False) + s[m.end(1):]
          if s.count('Character Sheet v523') != 1:
              raise SystemExit('v523 footer not found exactly once')
          s=s.replace('Character Sheet v523','Character Sheet v524')
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "f391651ef65e389063ac91bc3162e2aff31484a3"
          rm .github/workflows/apply-v524.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-v524.yml
          git commit -m "Audit technical daypack value (v524)"
          git push origin main
