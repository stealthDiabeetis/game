          prefix = "const GEAR_CATALOG = "
          s = text.index(prefix) + len(prefix)
          e = text.index(";\n", s)
          cat = json.loads(text[s:e])
          byid = {x["id"]: x for x in cat}
          
          for iid, (grams, status, schedule, body) in M.items():
              item = byid[iid]
              item["weight"] = grams / 453.59237
              item["medicationStatus"] = status
              if schedule:
                  item["controlledSchedule"] = schedule
              else:
                  item.pop("controlledSchedule", None)
              prefix_text = status + (f" · Federally controlled Schedule {schedule}" if schedule else "")
              item["specs"] = f"{prefix_text} · {body}"
          
          for item in cat:
              if item.get("subcategory") == "Medications > Prescription Antibiotics":
                  item["subcategory"] = "Medications > Antibiotics"
              elif item.get("subcategory") == "Medications > Prescription Pain & Neurologic":
                  item["subcategory"] = "Medications > Pain & Neurologic"
          
          ped = byid["gc2132"]
          ped.update({
              "category": "Everyday Carry & Personal",
              "subcategory": "Recreational Drugs > Performance-Enhancing Drugs",
              "specs": "Special character-level item representing ongoing performance-enhancing drug use; exact substances, dose and regimen are intentionally abstracted · This item remains linked to the character PED setting rather than representing one specific medication",
              "aliases": ["PEDs","performance enhancing drugs","performance-enhancing drugs","steroids","anabolic steroids","illicit PEDs"]
          })
          ped.pop("medicationStatus", None)
          ped.pop("controlledSchedule", None)
          
          text = text[:s] + json.dumps(cat, ensure_ascii=False, separators=(",", ":")) + text[e:]
          
          css_anchor = """    .bulk-gear-detail-value {
            margin-top: 3px;
            font-size: 11px;
            font-weight: 500;
            overflow-wrap: anywhere;
          }
          """
          css_repl = css_anchor + """    .medication-status-badge {
            display: inline-block;
            padding: 2px 7px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--panel-2);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .025em;
            white-space: nowrap;
          }
          """
          assert css_anchor in text
          text = text.replace(css_anchor, css_repl, 1)
          
          search_anchor = """      best = Math.max(best, catalogFieldTermScore(item?.availability, term, 80, 40, 20));
            best = Math.max(best, catalogFieldTermScore(item?.unit, term, 80, 40, 20));
          """
          search_repl = """      best = Math.max(best, catalogFieldTermScore(item?.availability, term, 80, 40, 20));
            best = Math.max(best, catalogFieldTermScore(item?.medicationStatus, term, 120, 80, 40));
            best = Math.max(best, catalogFieldTermScore(item?.controlledSchedule, term, 100, 60, 30));
            best = Math.max(best, catalogFieldTermScore(item?.unit, term, 80, 40, 20));
          """
          assert search_anchor in text
          text = text.replace(search_anchor, search_repl, 1)
          
          detail_anchor = """    const aliases = Array.isArray(item.aliases) && item.aliases.length ? item.aliases.join(', ') : '—';
            const bundleEntries = bulkSelectedGear.has(item.id)
          """
          detail_repl = """    const aliases = Array.isArray(item.aliases) && item.aliases.length ? item.aliases.join(', ') : '—';
            const medicationStatusField = item.medicationStatus
              ? `<div class="bulk-gear-detail-field"><div class="bulk-gear-detail-label">Medication Status</div><div class="bulk-gear-detail-value"><span class="medication-status-badge">${esc(item.medicationStatus)}</span></div></div>`
              : '';
            const controlledScheduleField = item.controlledSchedule
              ? `<div class="bulk-gear-detail-field"><div class="bulk-gear-detail-label">Federal Controlled Schedule</div><div class="bulk-gear-detail-value"><span class="medication-status-badge">C-${esc(item.controlledSchedule)}</span></div></div>`
              : '';
            const bundleEntries = bulkSelectedGear.has(item.id)
          """
          assert detail_anchor in text
          text = text.replace(detail_anchor, detail_repl, 1)
          
          detail_insert_anchor = """        <div class="bulk-gear-detail-field"><div class="bulk-gear-detail-label">Availability</div><div class="bulk-gear-detail-value">${esc(item.availability || '—')}</div></div>
                  ${randomStateField}
          """
          detail_insert_repl = """        <div class="bulk-gear-detail-field"><div class="bulk-gear-detail-label">Availability</div><div class="bulk-gear-detail-value">${esc(item.availability || '—')}</div></div>
                  ${medicationStatusField}
                  ${controlledScheduleField}
                  ${randomStateField}
          """
          assert detail_insert_anchor in text
          text = text.replace(detail_insert_anchor, detail_insert_repl, 1)
          
          row_anchor = """      const packageMeta = catalogPackageQuantity(item) > 1 ? ` · ${catalogQuantityText(item, q)}` : '';
                const meta = `${formatCatalogWeight(totals.weight)} · ${formatCatalogPrice(totals.price)} · ${item.availability || '—'}${packageMeta}${generatedMeta}`;
          """
          row_repl = """      const packageMeta = catalogPackageQuantity(item) > 1 ? ` · ${catalogQuantityText(item, q)}` : '';
                const medicationMeta = item.medicationStatus ? ` · ${item.medicationStatus}${item.controlledSchedule ? ` · C-${item.controlledSchedule}` : ''}` : '';
                const meta = `${formatCatalogWeight(totals.weight)} · ${formatCatalogPrice(totals.price)} · ${item.availability || '—'}${medicationMeta}${packageMeta}${generatedMeta}`;
          """
          assert row_anchor in text
          text = text.replace(row_anchor, row_repl, 1)
          
          assert text.count("Character Sheet v534") == 1
          text = text.replace("Character Sheet v534", "Character Sheet v535", 1)
          
          path.write_text(text)
          PY
          grep -q "Character Sheet v535" index.html
          git diff --check
