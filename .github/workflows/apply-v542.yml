name: Apply v542 bulk gear and alias updates

on:
  push:
    paths:
      - .github/workflows/apply-v542.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact v542 update
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "0767731d519fe0b95bfb6462576adecb70778a46"

          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          marker='const GEAR_CATALOG = '
          s=t.index(marker)+len(marker)
          assert t[s]=='['
          in_str=False; esc=False; depth=0; end=None
          for i,ch in enumerate(t[s:],s):
              if in_str:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': in_str=False
                  continue
              if ch=='"': in_str=True
              elif ch=='[': depth+=1
              elif ch==']':
                  depth-=1
                  if depth==0:
                      end=i+1; break
          assert end is not None
          cat=json.loads(t[s:end])
          byname={x['name']:x for x in cat}
          pwc=byname['Personal Watercraft']
          for alias in ['Jet Ski','WaveRunner','Sea-Doo']:
              if alias not in pwc['aliases']:
                  pwc['aliases'].append(alias)
          snow=byname['Snowmobile']
          if 'snowmachine' not in [a.lower() for a in snow['aliases']]:
              snow['aliases'].append('Snowmachine')
          newcat=json.dumps(cat,separators=(',',':'),ensure_ascii=False)
          t=t[:s]+newcat+t[end:]
          anchor='  function renderBulkGear() {\n'
          helpers='''  function captureBulkGearOpenPaths() {\n    const list = document.getElementById('bulkGearList');\n    if (!list) return [];\n    return [...list.querySelectorAll('details[data-bulk-gear-path][open]')]\n      .map(details => details.dataset.bulkGearPath)\n      .filter(Boolean);\n  }\n\n  function restoreBulkGearOpenPaths(paths) {\n    if (!paths?.length) return;\n    const openPaths = new Set(paths);\n    const list = document.getElementById('bulkGearList');\n    if (!list) return;\n    list.querySelectorAll('details[data-bulk-gear-path]').forEach(details => {\n      if (openPaths.has(details.dataset.bulkGearPath)) details.open = true;\n    });\n  }\n\n'''
          assert t.count(anchor)==1
          t=t.replace(anchor,helpers+anchor,1)
          old='''    const bulkDialogOpen = Boolean(document.getElementById('bulkGearDialog')?.open);\n    const randomWeightInput = document.getElementById('bulkGearRandomWeightMax');\n'''
          new='''    const bulkDialogOpen = Boolean(document.getElementById('bulkGearDialog')?.open);\n    const bulkGearOpenPaths = bulkDialogOpen ? captureBulkGearOpenPaths() : [];\n    const randomWeightInput = document.getElementById('bulkGearRandomWeightMax');\n'''
          assert t.count(old)==1
          t=t.replace(old,new,1)
          old2='''      updateBulkGearRandomWeightUnitUi();\n      renderBulkGear();\n      renderBulkGearDetail(GEAR_CATALOG_BY_ID.get(activeBulkGearId) || null);\n'''
          new2='''      updateBulkGearRandomWeightUnitUi();\n      renderBulkGear();\n      restoreBulkGearOpenPaths(bulkGearOpenPaths);\n      renderBulkGearDetail(GEAR_CATALOG_BY_ID.get(activeBulkGearId) || null);\n'''
          assert t.count(old2)==1
          t=t.replace(old2,new2,1)
          assert t.count('Character Sheet v541')==1
          t=t.replace('Character Sheet v541','Character Sheet v542',1)
          p.write_text(t,encoding='utf-8')
          PY

          echo 'fed1f2d07d8af7d0e21066d75e8a894bdfef245f9e9fca98f0349562008c79e6  index.html' | sha256sum -c -
          test "$(git hash-object index.html)" = "4363183f80fa11d7713213a8f1aea3bba47589aa"
          test "$(wc -c < index.html)" -eq 2331680
          grep -q 'Character Sheet v542' index.html

          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          assert len(scripts)==1
          Path('/tmp/v542.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/v542.js

      - name: Commit v542 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT GitHub Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-v542.yml
          git add index.html
          git commit -m 'Update index.html to v542'
          git push origin HEAD:main
