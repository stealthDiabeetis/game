name: Apply v539 index update

on:
  push:
    paths:
      - .github/workflows/apply-v539.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact v539 update
        shell: bash
        run: |
          set -euo pipefail
          current=$(git hash-object index.html)
          test "$current" = "9e0bb83409ed19593cf47608a2a49e34ff9c2f35"

          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'const GEAR_CATALOG = '
          start = text.index(marker) + len(marker)
          assert text[start] == '['

          in_str = False
          esc = False
          depth = 0
          end = None
          for i, ch in enumerate(text[start:], start):
              if in_str:
                  if esc:
                      esc = False
                  elif ch == '\\':
                      esc = True
                  elif ch == '"':
                      in_str = False
                  continue
              if ch == '"':
                  in_str = True
              elif ch == '[':
                  depth += 1
              elif ch == ']':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          assert end is not None

          catalog = json.loads(text[start:end])
          byid = {x['id']: x for x in catalog}
          byname = {x['name']: x for x in catalog}

          tshirt = byid['gc0011']
          for c in ['Camo Green', 'Camo Tan', 'Transitional Camo']:
              if c not in tshirt['colors']:
                  tshirt['colors'].append(c)

          expected_tents = {
              'Tent, Backpacking, 1-Person',
              'Tent, Backpacking, 2-Person',
              'Tent, Backpacking, 3-Person',
              'Tent, Backpacking, 4-Person',
              'Tent, Winter, 2-Person',
              'Tent, Expedition, 2-Person',
          }
          changed_tents = set()
          for item in catalog:
              if item['name'].startswith('Tent,') and 'Camo Green' in item.get('colors', []) and 'Camo Tan' in item.get('colors', []):
                  colors = item['colors']
                  if 'Transitional Camo' not in colors:
                      colors.insert(colors.index('Camo Tan') + 1, 'Transitional Camo')
                  changed_tents.add(item['name'])
          assert changed_tents == expected_tents

          water = byid['gc1145']
          assert water['name'] == 'Water Blaster, Handheld'
          water.update({
              'name': 'Squirt Gun, Pistol',
              'weight': 0.28,
              'price': 8.0,
              'availability': 'Common',
              'specs': 'Compact one-handed toy water pistol · Empty weight about 4.5 oz · Reservoir about 8 fl oz / 0.24 L · Typical effective stream roughly 15–20 ft; simple trigger/pump action depending on model',
              'aliases': ['water blaster', 'water gun', 'water pistol', 'squirt pistol', 'Water Blaster, Handheld'],
          })

          assert 'gc2338' not in byid and 'Squirt Gun, Pump' not in byname
          pump = {
              'id':'gc2338','name':'Squirt Gun, Pump','category':'Sports, Games & Recreation',
              'subcategory':'Toys > Action Toys','weight':1.55,'price':25.0,'availability':'Common',
              'colors':['Black','Blue','Brown','Gray','Green','Navy Blue','Orange','Pink','Purple','Red','Tan','Teal','White','Yellow'],
              'specs':'Larger two-handed pump-action water blaster · Empty weight about 1.55 lb · Reservoir about 50 fl oz / 1.5 L · Typical effective stream roughly 30–35 ft · Front pump grip requires two-handed cycling for sustained pressure',
              'createsLocation':False,
              'aliases':['water blaster','water blaster pump','water gun','pump water gun','super soaker','two-hand water blaster'],
              'unit':'each','defaultQuantity':1
          }
          wi = next(i for i, x in enumerate(catalog) if x['id'] == 'gc1145')
          catalog.insert(wi + 1, pump)

          assert 'gc2337' not in byid and 'Falconry Glove' not in byname
          falcon = {
              'id':'gc2337','name':'Falconry Glove','category':'Pet & Animal Care','subcategory':'Bird Care',
              'weight':0.35,'price':55.0,'availability':'Specialty',
              'colors':['Black','Brown','Tan'],
              'specs':'Single heavy-leather hawking glove for handling raptors · Typical falcon glove about 10–12 in long with wrist/short forearm coverage · Usually worn on the non-dominant hand · Suitable for falcons and similar small-to-medium raptors; larger hawks and eagles commonly require a longer/heavier gauntlet',
              'createsLocation':False,
              'aliases':['falcon glove','hawking glove','raptor glove','raptor handling glove','falconry gauntlet'],
              'unit':'each','defaultQuantity':1,'wetRetention':'moderate','dirtRetention':'low'
          }
          bird_idxs = [i for i, x in enumerate(catalog) if x.get('category') == 'Pet & Animal Care' and x.get('subcategory') == 'Bird Care']
          assert bird_idxs
          catalog.insert(max(bird_idxs) + 1, falcon)

          new_catalog = json.dumps(catalog, separators=(',', ':'), ensure_ascii=False)
          text = text[:start] + new_catalog + text[end:]
          assert text.count('Character Sheet v538') == 1
          text = text.replace('Character Sheet v538', 'Character Sheet v539', 1)
          p.write_text(text, encoding='utf-8')
          PY

          echo 'c4c1f903a1cb3599257a4cad4adf1aa6fcb1dead050a7fcd5e03fe3a6565e96a  index.html' | sha256sum -c -
          test "$(git hash-object index.html)" = "2de95c7efb9db943cde0e2bd483de6846181b026"
          test "$(wc -c < index.html)" -eq 2320725
          grep -q 'Character Sheet v539' index.html

          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          assert len(scripts) == 1
          Path('/tmp/v539.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/v539.js

          rm .github/workflows/apply-v539.yml
          git config user.name "ChatGPT GitHub Integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-v539.yml
          git commit -m "Update index.html to v539"
          git push origin HEAD:main
