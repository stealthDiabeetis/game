name: Apply v523 backpack realism audit
on:
  push:
    paths:
      - '.github/workflows/apply-v523.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v523
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "a1c50f604e8a6e18a2d5e3d7cf8eece985c43db4"
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'const GEAR_CATALOG = (\[.*?\]);\n', s, re.S)
          if not m:
              raise SystemExit('GEAR_CATALOG not found')
          cat=json.loads(m.group(1))
          byid={x['id']:x for x in cat}

          back_ids=[x['id'] for x in cat if x.get('category')=='Bags, Packs & Containers' and ('Backpack' in x.get('name','') or 'Daypack' in x.get('name',''))]
          for bid in back_ids:
              it=byid[bid]
              cap=it.get('locationCapacityPounds')
              if cap is not None and it.get('specs'):
                  it['specs']=re.sub(r'(Maximum Load|Recommended Load|Load Capacity):\s*[\d.]+\s*lb', f'Practical Load: {cap:g} lb', it['specs'])

          byid['gc0095'].update({
              'weight':5.5,
              'price':110.0,
              'locationCapacityPounds':50.0,
              'specs':'Volume: 75 L · Practical Load: 50 lb · Durable budget full-size internal-frame backpack with adjustable suspension and integrated rain cover · Hydration: reservoir compatible; reservoir not included'
          })

          for bid,price,vol in [('gc0096',550.0,'55 L'),('gc0097',600.0,'65 L'),('gc0098',650.0,'80 L')]:
              it=byid[bid]
              it['price']=price
              it['locationCapacityPounds']=100.0
              it['specs']=f'Volume: {vol} · Practical Load: 100 lb · Structural Load Rating: 150+ lb · Rugged specialized load-hauling frame with integrated load shelf, reinforced heavy-duty fabric, and load-transfer suspension'

          byid['gc0099'].update({
              'weight':6.3,
              'price':490.0,
              'locationCapacityPounds':70.0,
              'specs':'Volume: 90 L · Practical Load: 70 lb · Rugged expedition-grade high-tenacity construction with heavy-duty internal frame, adjustable load-transfer suspension, and integrated rain protection'
          })

          byid['gc0090']['specs']='Volume: 50 L · Practical Load: 30 lb · Framed ultralight pack optimized for very low empty weight rather than rugged heavy-load hauling'
          byid['gc0089']['specs']='Volume: 40 L · Practical Load: 30 lb · Frameless ultralight pack optimized for minimum empty weight and light loads'
          byid['gc0091']['specs']='Volume: 55 L · Practical Load: 35 lb · Ultralight framed pack optimized for low empty weight with moderate load support'
          byid['gc0092']['specs']='Volume: 48 L · Practical Load: 35 lb · Lightweight framed backpacking pack balancing low empty weight with conventional load support'
          byid['gc0093']['specs']='Volume: 60 L · Practical Load: 40 lb · Lightweight framed backpacking pack balancing low empty weight with conventional load support'

          tactical_colors=['Black','Blue','Gray','Green','Multicolor','Navy Blue','Orange','Purple','Red','Tan']
          for bid in ['gc0100','gc0101','gc0102','gc0103']:
              it=byid[bid]
              it['colors']=tactical_colors.copy()
              vol=re.search(r'(\d+)\s*L', it['name']).group(1)
              cap=it['locationCapacityPounds']
              it['specs']=f'Volume: {vol} L · Practical Load: {cap:g} lb · Rugged abrasion-resistant tactical construction with reinforced stitching, modular webbing, and organized compartments · Hydration: reservoir compatible; reservoir not included'

          byid['gc0094']['specs']=byid['gc0094']['specs'].replace('Maximum Load: 35 lb','Practical Load: 35 lb')

          s=s[:m.start(1)] + json.dumps(cat,separators=(',',':'),ensure_ascii=False) + s[m.end(1):]
          if 'Character Sheet v522' not in s:
              raise SystemExit('v522 footer not found')
          s=s.replace('Character Sheet v522','Character Sheet v523')
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "5db521d51fc1ed3d57b6f336117258e3116aa510"
          rm .github/workflows/apply-v523.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-v523.yml
          git commit -m "Rebalance backpack realism (v523)"
          git push origin main
