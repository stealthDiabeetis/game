name: ChatGPT single-file publish

on:
  push:
    branches: [main]
    paths:
      - '.chatgpt-upload.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild index.html
        shell: bash
        run: |
          base64 --decode .chatgpt-upload.b64 | gzip -dc > index.html
          echo "f7e177564099e1584f49505357fb33485b4090cc260d59ed6ca961725d08e77f  index.html" | sha256sum --check --strict
          grep -q 'Character Sheet v547' index.html

      - name: Commit and push index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update character sheet to v547"
          git push
