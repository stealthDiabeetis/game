name: Trigger v537 promotion

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    if: contains(github.event.issue.title, '[promote-v537]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v537 promotion workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-v537.yml --repo "$GITHUB_REPOSITORY" --ref main
