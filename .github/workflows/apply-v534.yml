name: Apply v534 naming cleanup
on:
  push:
    paths:
      - '.github/workflows/apply-v534.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import json, re

          p = Path("index.html")
          text = p.read_text()

          prefix = "const GEAR_CATALOG = "
          start = text.index(prefix) + len(prefix)
          end = text.index(";\n", start)
          catalog = json.loads(text[start:end])
          by_id = {x["id"]: x for x in catalog}

          rename_map = {
              "gc0807": "Wet Wipe",
              "gc0811": "Adult Brief, Disposable",
              "gc0809": "Menstrual Pad",
              "gc0808": "Tampon",
              "gc0729": "Paper Clip",
              "gc0728": "Staple",
          }
          for item_id, new_name in rename_map.items():
              by_id[item_id]["name"] = new_name

          by_id["gc1343"]["unit"] = "pair"
          by_id["gc1343"]["specs"] = (
              "Disposable air-activated toe warmers · Inventory unit: 1 pair · "
              "Common retail package quantity: 4 pairs"
          )

          new_catalog = json.dumps(catalog, ensure_ascii=False, separators=(",", ":"))
          text = text[:start] + new_catalog + text[end:]

          if text.count("Character Sheet v533") != 1:
              raise SystemExit("Expected exactly one v533 version marker")
          text = text.replace("Character Sheet v533", "Character Sheet v534")
          p.write_text(text)

          text2 = p.read_text()
          s2 = text2.index(prefix) + len(prefix)
          e2 = text2.index(";\n", s2)
          check = json.loads(text2[s2:e2])
          bad = []
          for x in check:
              if x.get("defaultQuantity", 1) <= 1:
                  continue
              nm = x["name"]
              if re.search(r"\bIndividual\b", nm, re.I) or re.search(r"\bSingle\b(?![- ]use)", nm, re.I):
                  bad.append((x["id"], nm, x.get("defaultQuantity")))
          if bad:
              raise SystemExit(f"Naming/package conflicts remain: {bad}")
          if next(x for x in check if x["id"] == "gc1343")["unit"] != "pair":
              raise SystemExit("Toe Warmers unit mismatch")
          PY
          python /tmp/patch.py
          git diff --check
          grep -q 'Character Sheet v534' index.html
      - name: Commit v534
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-v534.yml
          git add index.html .github/workflows/apply-v534.yml
          git commit -m 'Clean packaged-item naming (v534)'
          git push
