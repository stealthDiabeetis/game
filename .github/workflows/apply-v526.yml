name: Apply v526 school backpack practical loads
on:
  push:
    paths:
      - '.github/workflows/apply-v526.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v526
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "ce6fbed33a4bfe163825d5a69b790f910f68cb14"
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'const GEAR_CATALOG = (\[.*?\]);\n', s, re.S)
          if not m: raise SystemExit('GEAR_CATALOG not found')
          cat=json.loads(m.group(1)); byid={x['id']:x for x in cat}
          byid['gc2240'].update({
              'specs':'Volume: ~20 L · Practical Load: 12 lb · Basic lightweight polyester school/work backpack with shoulder-strap carry, a main compartment, and front pocket; no load-transferring frame or hipbelt',
              'locationCapacityPounds':12.0
          })
          byid['gc2241'].update({
              'specs':'Volume: 26 L · Practical Load: 15 lb · Classic lightweight school/work backpack with padded shoulder straps, roomy main compartment, and front organizer pocket; no load-transferring frame or hipbelt',
              'locationCapacityPounds':15.0
          })
          s=s[:m.start(1)] + json.dumps(cat,separators=(',',':'),ensure_ascii=False) + s[m.end(1):]
          if s.count('Character Sheet v525') != 1: raise SystemExit('v525 footer mismatch')
          s=s.replace('Character Sheet v525','Character Sheet v526')
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "8a816091b4a662156e3ab30748b3321815cb886b"
          rm .github/workflows/apply-v526.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-v526.yml
          git commit -m "Adjust school backpack practical loads (v526)"
          git push origin main
