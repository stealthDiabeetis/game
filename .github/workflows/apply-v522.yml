name: Apply v522 hydration inclusion audit
on:
  push:
    paths:
      - '.github/workflows/apply-v522.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v522
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "3a798bcca3b3b016364e3f0b1fa3e1e5dcac684d"
          python - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'const GEAR_CATALOG = (\[.*?\]);\n', s, re.S)
          if not m:
              raise SystemExit('GEAR_CATALOG not found')
          cat=json.loads(m.group(1))
          byid={x['id']:x for x in cat}
          byid['gc0094']['specs']='Volume: 45 L · Maximum Load: 35 lb · Budget internal-frame hiking/backpacking pack with padded hip belt, compression straps, and gear loops · Hydration: reservoir compatible; reservoir not included'
          byid['gc0671']['specs']='Wearable tactical hydration carrier · Includes 3 L / 100 oz hydration reservoir with drinking tube and bite valve · Small utility storage'
          s=s[:m.start(1)] + json.dumps(cat,separators=(',',':'),ensure_ascii=False) + s[m.end(1):]
          if 'Character Sheet v521' not in s:
              raise SystemExit('v521 footer not found')
          s=s.replace('Character Sheet v521','Character Sheet v522')
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "a1c50f604e8a6e18a2d5e3d7cf8eece985c43db4"
          rm .github/workflows/apply-v522.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-v522.yml
          git commit -m "Clarify hydration reservoir inclusion (v522)"
          git push origin main
