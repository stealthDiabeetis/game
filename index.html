<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cory's Weird Game Character Sheet</title></head>
<body><div style="font-family:system-ui,sans-serif;padding:24px">Loading character sheet…</div>
<script>
(async()=>{
  try {
    const [baseRes,patchRes]=await Promise.all([
      fetch('./index-v534-base.html?v=536',{cache:'no-store'}),
      fetch('./v536-patch.json.gz?v=536',{cache:'no-store'})
    ]);
    if(!baseRes.ok) throw new Error('Base file HTTP '+baseRes.status);
    if(!patchRes.ok) throw new Error('Patch file HTTP '+patchRes.status);
    let t=await baseRes.text();
    const ds=new DecompressionStream('gzip');
    const patch=JSON.parse(await new Response(patchRes.body.pipeThrough(ds)).text());
    if(!t.includes(patch.baseVersion)) throw new Error('Unexpected base version');
    const marker='const GEAR_CATALOG = ';
    const s=t.indexOf(marker)+marker.length, e=t.indexOf(';\n',s);
    const catalog=JSON.parse(t.slice(s,e));
    const byId=new Map(catalog.map(x=>[x.id,x]));
    for(const [id,fields] of Object.entries(patch.changes)){
      const item=byId.get(id); if(!item) throw new Error('Missing catalog item '+id);
      Object.assign(item,fields);
    }
    for(const [id,keys] of Object.entries(patch.remove||{})){
      const item=byId.get(id); for(const key of keys) delete item[key];
    }
    const ai=catalog.findIndex(x=>x.id===patch.insertAfter);
    if(ai<0) throw new Error('Insertion anchor missing');
    catalog.splice(ai+1,0,...patch.newItems);
    t=t.slice(0,s)+JSON.stringify(catalog)+t.slice(e);
    for(const [a,b] of patch.outside){
      const i=t.indexOf(a); if(i<0) throw new Error('UI patch anchor not found');
      t=t.slice(0,i)+b+t.slice(i+a.length);
    }
    if(!t.includes(patch.targetVersion)) throw new Error('Target version marker missing');
    document.open(); document.write(t); document.close();
  } catch(e) {
    document.body.innerHTML='<div style="font-family:system-ui,sans-serif;padding:24px"><h2>Could not load character sheet</h2><pre style="white-space:pre-wrap"></pre></div>';
    document.querySelector('pre').textContent=String(e&&e.stack||e);
  }
})();
</script></body></html>
